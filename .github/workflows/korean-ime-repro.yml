name: Korean IME reproduction
on:
  push:
    branches: [diagnostics/korean-ime-13235]
permissions:
  contents: read
jobs:
  reproduce:
    if: ${{ !contains(github.event.head_commit.message, 'build and test baseline') }}
    strategy:
      matrix:
        mode: [context-carbon-reopen, context-carbon-secure]
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile native input probe
        run: |
          sw_vers
          mkdir -p IMEProbe.app/Contents/MacOS
          swiftc diagnostics/IMEProbe.swift -o IMEProbe.app/Contents/MacOS/IMEProbe
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string IMEProbe' IMEProbe.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string local.ghostty.ime-probe' IMEProbe.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' IMEProbe.app/Contents/Info.plist
      - name: Record native Korean composition callbacks
        run: |
          open -W -n --stdout baseline.log --stderr baseline.log IMEProbe.app --args --${{ matrix.mode }}
          cat baseline.log
  ghostty-baseline:
    strategy:
      fail-fast: false
      matrix:
        version: [fixed]
    if: contains(github.event.head_commit.message, 'build and test baseline')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch comparison base
        run: git fetch --depth=1 origin 7c6e1011c237aaac3d19d094b3c4bdada3b21bc8
      - name: Select source version
        if: matrix.version == 'baseline'
        run: |
          git show 7c6e1011c237aaac3d19d094b3c4bdada3b21bc8:'macos/Sources/Ghostty/Surface View/SurfaceView_AppKit.swift' > 'macos/Sources/Ghostty/Surface View/SurfaceView_AppKit.swift'
          rm 'macos/Sources/Ghostty/Surface View/SurfaceInputContext.swift' macos/Tests/Ghostty/SurfaceInputContextTests.swift
      - name: Prepare toolchain
        run: |
          if test -d /Applications/Xcode_27.1.app; then sudo xcode-select -s /Applications/Xcode_27.1.app; fi
          xcodebuild -version
          mkdir -p tools
          curl -fLsS https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz -o tools/zig.tar.xz
          echo 'b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a  tools/zig.tar.xz' | shasum -a 256 -c
          tar -xf tools/zig.tar.xz -C tools
          curl -fLsS https://github.com/nushell/nushell/releases/download/0.116.1/nu-0.116.1-aarch64-apple-darwin.tar.gz -o tools/nu.tar.gz
          tar -xf tools/nu.tar.gz -C tools
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            macos/GhosttyKit.xcframework
            zig-out
          key: ghostty-13235-xcframework-7c6e1011-macos26-arm64-v1
      - name: Build native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: tools/zig-aarch64-macos-0.17.0/zig build -Demit-macos-app=false -Dxcframework-target=native -Doptimize=Debug
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            macos/GhosttyKit.xcframework
            zig-out
          key: ghostty-13235-xcframework-7c6e1011-macos26-arm64-v1
      - name: Build diagnostic app
        run: tools/nu-0.116.1-aarch64-apple-darwin/nu macos/build.nu --action build > baseline-tests.log 2>&1 || { tail -100 baseline-tests.log; exit 1; }
      - name: Exercise real Ghostty with native Korean IME
        run: |
          open -W -n --env GHOSTTY_IME_DIAGNOSTIC=1 --stdout "$PWD/native-input.log" --stderr "$PWD/native-input.log" macos/build/Debug/Ghostty.app
          cat native-input.log
          if test '${{ matrix.version }}' = baseline; then
            grep 'IME REAL RESULT FAIL' native-input.log
          else
            grep 'IME REAL RESULT PASS' native-input.log
          fi
      - name: Run complete macOS regression suite
        if: matrix.version == 'fixed'
        run: |
          git show 7c6e1011c237aaac3d19d094b3c4bdada3b21bc8:macos/build.nu > macos/build.nu
          tools/nu-0.116.1-aarch64-apple-darwin/nu macos/build.nu --action test > regression-tests.log 2>&1 || { tail -100 regression-tests.log; exit 1; }
          tail -30 regression-tests.log

      - name: Summarize final test result
        if: always()
        run: |
          results=($HOME/Library/Developer/Xcode/DerivedData/Ghostty-*/Logs/Test/*.xcresult)
          for result in "${results[@]}"; do xcrun xcresulttool get test-results summary --path "$result" --compact || true; done
